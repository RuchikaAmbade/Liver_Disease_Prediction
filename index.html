<!DOCTYPE html>
<html>
<head>
    <title>Liver Disease Prediction Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="gradient-background d-flex justify-content-center align-items-center vh-100">
        <div class="form-container bg-white p-4 rounded shadow">
            <h2 class="text-center mb-4">Liver Disease Prediction <em>Portal</em></h2>
            <form action="/predict" method="post">
                <div class="mb-3">
                    <label>Age</label>
                    <input type="number" name="Age" class="form-control" min="1" step="1" required>
                </div>
                <div class="mb-3">
                    <label>Total Bilirubin</label>
                    <input type="number" name="Total_Bilirubin" class="form-control" min="0" step="0.1" required>
                </div>
                <div class="mb-3">
                    <label>Direct Bilirubin</label>
                    <input type="number" name="Direct_Bilirubin" class="form-control" min="0" step="0.1" required>
                </div>
                <div class="mb-3">
                    <label>Alkaline Phosphatase</label>
                    <input type="number" name="Alkaline_Phosphatase" class="form-control" min="0" step="1" required>
                </div>
                <div class="mb-3">
                    <label>Alanine Aminotransferase (ALT)</label>
                    <input type="number" name="Alanine_Aminotransferase" class="form-control" min="0" step="1" required>
                </div>
                <div class="mb-3">
                    <label>Aspartate Aminotransferase (AST)</label>
                    <input type="number" name="Aspartate_Aminotransferase" class="form-control" min="0" step="1" required>
                </div>
                <div class="mb-3">
                    <label>Albumin</label>
                    <input type="number" name="Albumin" class="form-control" min="0" step="0.1" required>
                </div>
                <div class="mb-3">
                    <label>Albumin and Globulin Ratio</label>
                    <input type="number" name="Albumin_and_Globulin_Ratio" class="form-control" min="0" step="0.1" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Predict</button>
            </form>
        </div>
    </div>
</body>
</html>
